<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9Pay</title><style>body{margin:0;font-family:sans-serif;background:#f2f2f2}.h{background:#10b981;padding:24px 16px 40px;color:#fff}.b{font-size:32px;font-weight:800;margin:8px 0}.c{background:#fff;margin:-24px 12px 12px;padding:14px;border-radius:16px;display:flex;justify-content:space-around;box-shadow:0 4px 12px #0002;text-align:center}.i{width:44px;height:44px;background:#e6f9f3;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 4px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}.gi{background:#fff;padding:12px 4px;border-radius:12px;text-align:center;font-size:11px;font-weight:600}button{background:#10b981;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:700}.hist{background:#fff;margin:12px;border-radius:12px;padding:12px}</style></head><body><div class="h"><div style="display:flex;justify-content:space-between"><span>Hi, Love 👋</span><span>🔔</span></div><div class="b" id="bal">₦0.00</div><div>Available • <span onclick="tog()">👁️</span></div></div><div class="c"><div onclick="addM()"><div class="i">+</div>Add</div><div onclick="tran()"><div class="i">↗️</div>Transfer</div><div onclick="alert('Withdraw')"><div class="i">🏧</div>Withdraw</div></div><div class="g"><div class="gi" onclick="buy('Airtime')">📱<br>Airtime</div><div class="gi" onclick="buy('Data')">📶<br>Data</div><div class="gi" onclick="buy('Betting')">⚽<br>Betting</div><div class="gi" onclick="buy('Light')">💡<br>Light</div><div class="gi" onclick="buy('TV')">📺<br>TV</div><div class="gi">💳<br>Card</div><div class="gi">📜<br>History</div><div class="gi">•••<br>More</div></div><div class="hist" id="hist">No transactions. Tap Add Money.</div><script>let b=0,h=false,el=document.getElementById('bal'),ht=document.getElementById('hist');function up(){el.innerText=h?'₦****':'₦'+b.toLocaleString()+'.00'}function addM(){b+=5000;up();ht.innerHTML='+ ₦5000<br>'+ht.innerHTML}function tran(){let a=prompt('Amount:');if(a&&a<=b){b-=a;up();ht.innerHTML='- Transfer ₦'+a+'<br>'+ht.innerHTML}else if(a)alert('Low balance, tap Add')}function buy(s){let a=prompt(s+' amount:');if(a&&a<=b){b-=a;up();ht.innerHTML='- '+s+' ₦'+a+'<br>'+ht.innerHTML}else if(a)alert('Low balance')}function tog(){h=!h;up()}up()</script></body></html>
