v><script>
// === PUT YOUR KEYS HERE ===
const PAYSTACK_KEY = "pk_test_YOUR_KEY_HERE"; // Replace with your real paystack public key
// ==========================
let balance = parseInt(localStorage.getItem('bal')||0);
let el=document.getElementById('bal'), ht=document.getElementById('hist');
function update(){el.innerText='₦'+balance.toLocaleString()+'.00';localStorage.setItem('bal',balance)}
function addMoney(){
 let amt=document.getElementById('amount').value||1000;
 if(PAYSTACK_KEY.includes('YOUR_KEY')){alert('To collect REAL money: 1. Go to paystack.com 2. Get your Public Key 3. Paste in code where it says YOUR_KEY_HERE'); balance+=parseInt(amt); update(); ht.innerHTML='+ Fund ₦'+amt+' (DEMO - Add Paystack Key for real)<br>'+ht.innerHTML; return}
 let handler=PaystackPop.setup({key:PAYSTACK_KEY,email:'customer@9pay.com',amount:amt*100,currency:'NGN',callback:function(res){balance+=parseInt(amt); update(); ht.innerHTML='+ PAID ₦'+amt+' Ref:'+res.reference+'<br>'+ht.innerHTML; alert('Payment success! ₦'+amt+' added to YOUR Paystack balance!')},onClose:function(){alert('Payment closed')}}); handler.openIframe();
}
function buyAirtime(){let p=document.getElementById('phone').value, a=document.getElementById('amount').value; if(!p||!a)return alert('Enter phone & amount'); if(balance<a)return alert('Low balance, fund wallet'); balance-=a; update(); ht.innerHTML='- Airtime ₦'+a+' to '+p+'<br>'+ht.innerHTML; alert('Airtime sent! Your profit: ₦'+Math.round(a*0.1)+' (You bought for less)') }
function buyData(){let p=document.getElementById('phone').value, a=document.getElementById('amount').value; if(!p||!a)return alert('Enter phone & amount'); if(balance<a)return alert('Low balance'); balance-=a; update(); ht.innerHTML='- Data ₦'+a+' to '+p+'<br>'+ht.innerHTML; alert('Data sent! Profit: ₦'+Math.round(a*0.12)+' for you!') }
update();
